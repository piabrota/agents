name: image

# The agents' image (Dockerfile) on GitHub's registry, ghcr.io/piabrota/agents, which
# piabrota/nix-os's tasks pull by digest. A pull request builds it and pushes nothing; a push to
# main publishes it as `main` and `sha-<commit>`. The run summary prints the digest.
on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'bin/**', 'lib/**', 'agents/**', 'prompts/**', '.github/workflows/image.yml']
  pull_request:
    paths: ['Dockerfile', 'bin/**', 'lib/**', 'agents/**', 'prompts/**', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agents
          tags: |
            type=ref,event=branch
            type=sha,format=short
      # amd64 only: the VPS is x86_64.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agents
          cache-to: type=gha,scope=agents,mode=max
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo '### agents'
            echo
            echo "Pushed: $PUSHED"
            echo
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
