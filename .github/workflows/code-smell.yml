name: 🧩 Code smell check

# Strict checks for the code here, beyond CI's shellcheck and tests. Python (test/, the fake
# GitHub) under every ruff rule in ruff.toml and radon's complexity; the bash under shfmt's format.
# A finding stops the job.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  code-smell:
    name: Ruff strict rules, complexity and shell format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Ruff format check
        run: uvx ruff@0.14.2 format --check .

      - name: Ruff strict rules (ruff.toml)
        run: uvx ruff@0.14.2 check .

      - name: Complexity (radon, fail on rank C or worse)
        run: |
          uvx radon@6.0.1 cc -s -a .
          if uvx radon@6.0.1 cc -n C . | grep -q .; then
            echo "A function has complexity rank C or worse."
            exit 1
          fi

      # The bash, as `ruff format` is for the Python: two spaces, indented case branches.
      - name: Shell format (shfmt)
        run: |
          curl -fsSL -o /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          echo "1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc  /usr/local/bin/shfmt" | sha256sum -c -
          chmod +x /usr/local/bin/shfmt
          shfmt -d -i 2 -ci bin/agent agents lib test/run.sh test/fake-claude
